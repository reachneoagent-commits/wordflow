name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build wordflow (release, macOS)
        run: cargo build --release -p wordcraft

      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Create macOS app bundle
        run: |
          APP_BUNDLE="Wordflow.app"
          rm -rf "$APP_BUNDLE"
          mkdir -p "$APP_BUNDLE/Contents/MacOS"
          mkdir -p "$APP_BUNDLE/Contents/Resources"
          cp target/release/wordcraft "$APP_BUNDLE/Contents/MacOS/wordcraft"
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0">\n<dict>\n\t<key>CFBundleDisplayName</key>\n\t<string>Wordflow</string>\n\t<key>CFBundleIdentifier</key>\n\t<string>com.wordflow.app</string>\n\t<key>CFBundleExecutable</key>\n\t<string>wordcraft</string>\n\t<key>CFBundleIconFile</key>\n\t<string>Wordflow.icns</string>\n\t<key>CFBundleName</key>\n\t<string>Wordflow</string>\n\t<key>CFBundlePackageType</key>\n\t<string>APPL</string>\n\t<key>CFBundleShortVersionString</key>\n\t<string>%s</string>\n\t<key>CFBundleVersion</key>\n\t<string>%s</string>\n\t<key>NSHumanReadableCopyright</key>\n\t<string>© Reach Neo</string>\n</dict>\n</plist>\n' "$VERSION" "$VERSION" > "$APP_BUNDLE/Contents/Info.plist"

      - name: Create macOS DMG
        run: |
          mkdir -p dist
          hdiutil create -srcfolder Wordflow.app -ov -format UDZO "dist/wordflow-${VERSION}-macos-arm64.dmg"
          hdiutil internet-enable -yes "dist/wordflow-${VERSION}-macos-arm64.dmg"

      - name: Upload macOS asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/wordflow-${{ env.VERSION }}-macos-arm64.dmg
          generate_release_notes: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build wordflow (release, Windows)
        run: cargo build --release -p wordcraft

      - name: Extract version from tag
        run: echo "VERSION=$($env:GITHUB_REF_NAME.TrimStart('v'))" >> $env:GITHUB_ENV

      - name: Create Windows portable zip
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target/release/wordcraft.exe -DestinationPath "dist/wordflow-${{ env.VERSION }}-windows-x64-portable.zip"

      - name: Upload Windows asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/wordflow-${{ env.VERSION }}-windows-x64-portable.zip
          generate_release_notes: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  checksums:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate SHA256SUMS.txt from release assets
        run: |
          gh release download "${{ github.ref_name }}" --dir dist --pattern "*"
          cd dist
          sha256sum * > SHA256SUMS.txt

      - name: Upload checksums
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
