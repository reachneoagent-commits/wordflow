name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build wordflow (release, macOS)
        run: cargo build --release -p wordflow

      - name: Create macOS artifact
        run: |
          mkdir -p dist
          cp target/release/wordflow "dist/Wordflow-${{ github.ref_name }}-macos-arm64"

      - name: Upload macOS asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Wordflow-${{ github.ref_name }}-macos-arm64
          generate_release_notes: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build wordflow (release, Windows)
        run: cargo build --release -p wordflow

      - name: Create Windows artifact
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/release/wordflow.exe "dist/Wordflow-${{ github.ref_name }}-windows-x64.exe"

      - name: Upload Windows asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Wordflow-${{ github.ref_name }}-windows-x64.exe
          generate_release_notes: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  checksums:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate SHA256SUMS.txt from release assets
        run: |
          gh release download "${{ github.ref_name }}" --dir dist --pattern "*"
          cd dist
          sha256sum * > SHA256SUMS.txt

      - name: Upload checksums
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
